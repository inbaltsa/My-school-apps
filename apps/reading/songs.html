<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <!-- Google Analytics (מזהה האתר הגדול) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W58S98V8J0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-W58S98V8J0');
    </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שירי האותיות 🎵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Secular+One&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Heebo',system-ui,sans-serif;color:#3a2a12;overflow-x:hidden;
       background:linear-gradient(180deg,#ffe9f4 0%,#fff0d8 55%,#e8f5ff 100%);min-height:100vh;padding-bottom:40px;}

  .sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .sky .floaty{position:absolute;opacity:.7;animation:drift linear infinite;}
  @keyframes drift{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(10deg)}100%{transform:translateY(0) rotate(0)}}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
         padding:10px 14px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
         box-shadow:0 2px 12px rgba(0,0,0,.08);}
  header .home{width:44px;height:44px;border-radius:50%;border:2px solid #ffb74d;background:#fff;
       font-size:1.3em;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#e65100;}
  header .title{font-weight:800;font-size:1.2em;color:#a3155e;}

  .hero{position:relative;z-index:2;text-align:center;padding:16px 16px 2px;}
  .hero h1{font-family:'Secular One',system-ui,sans-serif;margin:4px 0 2px;
       font-size:clamp(1.3rem,5.6vw,2rem);
       background:linear-gradient(90deg,#ff5ca8,#ffb703,#39c6a6,#8f6ed5);
       -webkit-background-clip:text;background-clip:text;color:transparent;
       filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));}
  .hero .sub{font-weight:700;color:#7a5cc0;font-size:1rem;margin-top:2px;}

  .songs{position:relative;z-index:2;max-width:620px;margin:10px auto 0;padding:6px 14px;
         display:flex;flex-direction:column;gap:20px;}
  .song{background:rgba(255,255,255,.8);border-radius:22px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.08);}
  .song h2{margin:2px 6px 10px;font-size:1.15em;color:#5a3d1e;display:flex;align-items:center;gap:8px;}
  .song h2 .num{background:#ffcf4d;color:#7a4a00;border-radius:50%;width:28px;height:28px;flex-shrink:0;
       display:flex;align-items:center;justify-content:center;font-size:.85em;box-shadow:0 2px 0 #e0a92e;}
  .vid{position:relative;width:100%;padding-top:56.25%;border-radius:16px;overflow:hidden;
       background:#000;box-shadow:0 6px 16px rgba(0,0,0,.18);}
  .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

  .note{text-align:center;color:#8d6e63;font-size:.92em;margin:14px auto 0;max-width:360px;position:relative;z-index:2;}
</style>
</head>
<body>
  <div class="sky" id="sky"></div>
  <header>
    <a class="home" href="grade1.html?view=letters" title="חזרה למפת האותיות">🏠</a>
    <span class="title">🎵 שירי האותיות</span>
  </header>

  <div class="hero">
    <h1>שירי האותיות</h1>
    <div class="sub">בואו נשיר יחד את האותיות 🎶</div>
  </div>

  <div class="songs" id="songs"></div>
  <p class="note">שירה חוזרת עוזרת לזכור את שמות האותיות וסדר האלף־בית 💛<br>(השירים מתנגנים מיוטיוב — צריך חיבור לאינטרנט)</p>

  <script>
    // כדי להוסיף שיר: מוסיפים אובייקט לרשימה (id = מזהה הסרטון ביוטיוב)
    const SONGS = [
      { id: 'f7wWU7lzN3Q', title: 'שיר האלף־בית 🎵' },
      { id: 'XtDIFvN05oc', title: 'שיר האותיות 🎶' },
      { id: '7lfRjvayNbM', title: 'עוד שיר אותיות 🎼' },
    ];

    const wrap = document.getElementById('songs');
    SONGS.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'song';
      el.innerHTML =
        `<h2><span class="num">${i + 1}</span>${s.title}</h2>
         <div class="vid">
           <iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(s.id)}?rel=0"
                   title="${s.title}" loading="lazy"
                   allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share"
                   referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
         </div>`;
      wrap.appendChild(el);
    });

    // רקע שמיים מונפש
    (function fillSky() {
      const sky = document.getElementById('sky');
      const emojis = ['🎵', '🎶', '⭐', '🎈', '🌈', '✨', '🎼', '☁️'];
      for (let i = 0; i < 10; i++) {
        const f = document.createElement('div');
        f.className = 'floaty';
        f.textContent = emojis[i % emojis.length];
        f.style.top = Math.random() * 95 + 'vh';
        f.style.left = Math.random() * 92 + 'vw';
        f.style.fontSize = (1.3 + Math.random() * 2) + 'rem';
        f.style.animationDuration = (5 + Math.random() * 6) + 's';
        f.style.animationDelay = (-Math.random() * 6) + 's';
        sky.appendChild(f);
      }
    })();
  </script>
</body>
</html>
