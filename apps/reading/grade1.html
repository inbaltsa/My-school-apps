<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <!-- Google Analytics (מזהה האתר הגדול) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W58S98V8J0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-W58S98V8J0');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>אותיות א–ה · כיתה א' 🌱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Secular+One&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Heebo',system-ui,sans-serif;color:#3a2a12;overflow-x:hidden;
       background:linear-gradient(180deg,#d6f5ee 0%,#fff0d8 55%,#ffe1c2 100%);
       min-height:100vh;padding-bottom:50px;}

  .sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .sky .floaty{position:absolute;opacity:.7;animation:drift linear infinite;}
  @keyframes drift{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(10deg)}100%{transform:translateY(0) rotate(0)}}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
         padding:10px 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);
         box-shadow:0 2px 12px rgba(0,0,0,.08);}
  header .home{width:44px;height:44px;border-radius:50%;border:2px solid #ffb74d;background:#fff;
       font-size:1.3em;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#e65100;}
  header .title{font-weight:800;font-size:1.2em;color:#5a3d1e;display:flex;align-items:center;gap:7px;}
  header .title .logo{display:inline-flex;}
  header .stars{font-weight:800;color:#f9a825;background:#fff;border-radius:50px;padding:6px 14px;
       box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:1.05em;}

  .hero{position:relative;z-index:2;text-align:center;padding:16px 16px 4px;}
  .hero .uni{display:flex;justify-content:center;animation:heroBob 2.4s ease-in-out infinite;}
  @keyframes heroBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
  .hero h1{font-family:'Secular One',system-ui,sans-serif;margin:4px 0 2px;
       font-size:clamp(1.3rem,5.6vw,2rem);line-height:1.15;padding:0 10px;
       background:linear-gradient(90deg,#39c6a6,#ffb703,#ff7a59,#8f6ed5);
       -webkit-background-clip:text;background-clip:text;color:transparent;
       filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));}
  .hero .abc{font-weight:800;color:#ef6c00;letter-spacing:10px;font-size:1.6rem;margin-top:2px;}
  .hero .sub{font-weight:700;color:#7a5cc0;font-size:1rem;margin-top:4px;}

  .tracks{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:6px 12px 30px;}
  .track{background:rgba(255,255,255,.72);border-radius:24px;padding:12px 10px 18px;margin:16px 0;
       box-shadow:0 6px 18px rgba(0,0,0,.08);}
  .track-banner{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px auto 12px;
       font-weight:800;color:#5a3d1e;font-size:1.1em;}
  .track-banner .num{background:#ffcf4d;color:#7a4a00;border-radius:50%;width:30px;height:30px;
       display:flex;align-items:center;justify-content:center;font-size:.95em;box-shadow:0 2px 0 #e0a92e;}

  .row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;}
  .node-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;width:96px;
       text-decoration:none;color:#5a3d1e;transition:transform .15s;}
  .node-wrap:active{transform:scale(.94);}
  .node{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       font-size:2.4rem;position:relative;border:5px solid rgba(255,255,255,.9);
       box-shadow:inset 0 8px 11px rgba(255,255,255,.6), inset 0 -11px 15px rgba(0,0,0,.14),
                  0 6px 0 rgba(0,0,0,.10), 0 11px 18px rgba(0,0,0,.16);
       animation:nodepop .4s backwards;}
  @keyframes nodepop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .node .glyph{filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));}
  .node.meet{background:radial-gradient(circle at 34% 28%,#ffe7c2,#ffb45a);}
  .node.write{background:radial-gradient(circle at 34% 28%,#d8efff,#79bdff);}
  .node.sound{background:radial-gradient(circle at 34% 28%,#ffdcef,#ff9ec9);}
  .node.hunt{background:radial-gradient(circle at 34% 28%,#d3f7d8,#86dd98);}
  .node.hear{background:radial-gradient(circle at 34% 28%,#eadfff,#b39bf0);}
  .node.memory{background:radial-gradient(circle at 34% 28%,#ffe0c2,#ff9a6a);}
  .node.letterpair{background:radial-gradient(circle at 34% 28%,#cdeeec,#5fcabb);}
  .node.catch{background:radial-gradient(circle at 34% 28%,#ffe3f1,#ff9ec9);}
  .node.odd{background:radial-gradient(circle at 34% 28%,#e5dcff,#b39bf0);}
  .node.rhymematch{background:radial-gradient(circle at 34% 28%,#d6f0ff,#7ec8f0);}
  .node.quiz{background:radial-gradient(circle at 34% 28%,#fff0b0,#ffcb3d);border-color:#ffd76a;
       box-shadow:inset 0 8px 11px rgba(255,255,255,.6),inset 0 -11px 15px rgba(0,0,0,.14),
                  0 0 0 3px #ffb300,0 6px 0 rgba(0,0,0,.10),0 11px 18px rgba(0,0,0,.18);}
  .node.done::after{content:"✓";position:absolute;top:-6px;right:-6px;background:#4caf50;color:#fff;
       width:24px;height:24px;border-radius:50%;font-size:.95rem;display:flex;align-items:center;
       justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .caption{font-size:.82em;font-weight:700;text-align:center;line-height:1.15;}
  .ministars{font-size:.8em;letter-spacing:1px;height:1em;}
  .ministars .f{color:#ffb300;}
  .ministars .e{color:#d8d2c8;}

  .footnote{text-align:center;color:#8d6e63;font-size:.9em;margin:6px auto 0;max-width:340px;}
</style>
</head>
<body>
  <div class="sky" id="sky"></div>
  <header>
    <a class="home" href="../../grade-1.html" title="חזרה לכיתה א'">🏠</a>
    <span class="title"><span class="logo" id="logo"></span>אותיות א–ה</span>
    <span class="stars" id="totalStars">⭐ 0</span>
  </header>

  <div class="hero">
    <div class="uni" id="heroUni"></div>
    <h1>האותיות של כיתה א'</h1>
    <div class="abc">א ב ג ד ה</div>
    <div class="sub" id="heroSub">בוחרים מסלול קצר ומתחילים לשחק ✨</div>
  </div>

  <div class="tracks" id="tracks"></div>
  <p class="footnote">אותו סט משחקים כמו במסע הגדול — רק עם חמש האותיות הראשונות 💛</p>

  <script src="reading-data.js?v=21"></script>
  <script src="reading-progress.js?v=16"></script>
  <script src="reading-profile.js?v=16"></script>
  <script src="reading-voices.js?v=18"></script>
  <script src="reading-engine.js?v=17"></script>
  <script src="phono-data.js?v=21"></script>
  <script>
    document.getElementById('logo').innerHTML = RG.unicorn(32);
    document.getElementById('heroUni').innerHTML = RG.unicorn(80);
    (function(){ const g = ReadingProfile.gender();
      document.getElementById('heroSub').textContent =
        (g === 'm' ? 'בוחר מסלול קצר ומתחיל לשחק ✨' : 'בוחרים מסלול קצר ומתחילים לשחק ✨'); })();

    const GAME_FILE = { meet: 'games/meet.html', write: 'games/write.html', sound: 'games/sound.html',
                        hunt: 'games/hunt.html', hear: 'games/hear.html', memory: 'games/memory.html',
                        letterpair: 'games/memory-letters.html', quiz: 'games/quiz.html',
                        catch: 'phono-games/initial.html', odd: 'phono-games/odd.html',
                        rhymematch: 'phono-games/rhyme-match.html' };

    const tracksEl = document.getElementById('tracks');
    const stations = GRADE1_STATIONS;
    const phonoStations = window.GRADE1_PHONO_STATIONS || [];

    // מסלול הצלילים מצטרף כמסלול קצר נוסף (אותם משחקים, רק צלילי א–ה)
    const phonoTrack = { id: 'tp', name: 'משחקי צלילים', emoji: '🦻', phono: true };
    const ALL_TRACKS = GRADE1_TRACKS.concat([phonoTrack]);
    const stationsOf = track => track.phono ? phonoStations : stations.filter(s => s.trackId === track.id);

    // ?track=t1 — פותחים מסלול קצר אחד בלבד (כרטיסייה ייעודית בעמוד הכיתה)
    const wantTrack = new URLSearchParams(location.search).get('track');
    const shownTracks = wantTrack
      ? ALL_TRACKS.filter(t => t.id === wantTrack)
      : ALL_TRACKS;
    const tracksToRender = shownTracks.length ? shownTracks : ALL_TRACKS;

    tracksToRender.forEach(track => {
      const realNum = ALL_TRACKS.findIndex(t => t.id === track.id) + 1;
      const section = document.createElement('div');
      section.className = 'track';
      const banner = document.createElement('div');
      banner.className = 'track-banner';
      banner.innerHTML = `<span class="num">${realNum}</span>
                          <span>${track.emoji} ${track.name}</span>`;
      section.appendChild(banner);

      const row = document.createElement('div');
      row.className = 'row';

      stationsOf(track).forEach((st, i) => {
        const done = ReadingProgress.isDone(st.id);
        const stars = ReadingProgress.starsOf(st.id);

        const wrap = document.createElement('a');
        wrap.className = 'node-wrap';
        wrap.href = GAME_FILE[st.type] + '?station=' + encodeURIComponent(st.id);

        const node = document.createElement('div');
        node.className = 'node ' + st.type + (done ? ' done' : '');
        node.style.animationDelay = Math.min(i * 0.05, 0.6) + 's';
        node.innerHTML = `<span class="glyph">${st.emoji}</span>`;

        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.textContent = st.short || st.title;

        const ms = document.createElement('div');
        ms.className = 'ministars';
        if (done) {
          let h = '';
          for (let k = 1; k <= 3; k++) h += `<span class="${k <= stars ? 'f' : 'e'}">${k <= stars ? '★' : '☆'}</span>`;
          ms.innerHTML = h;
        } else {
          ms.innerHTML = '&nbsp;';
        }

        wrap.appendChild(node);
        wrap.appendChild(caption);
        wrap.appendChild(ms);
        row.appendChild(wrap);
      });

      section.appendChild(row);
      tracksEl.appendChild(section);
    });

    // סך הכוכבים — כל העבודה על א–ה (אותיות + צלילים)
    const g1Stars = stations.concat(phonoStations)
      .reduce((sum, s) => sum + ReadingProgress.starsOf(s.id), 0);
    document.getElementById('totalStars').textContent = '⭐ ' + g1Stars;

    // רקע שמיים מונפש
    (function fillSky() {
      const sky = document.getElementById('sky');
      const emojis = ['☁️', '⭐', '🎈', '🌈', '🦋', '✨', '🌤️', '☁️'];
      for (let i = 0; i < 10; i++) {
        const f = document.createElement('div');
        f.className = 'floaty';
        f.textContent = emojis[i % emojis.length];
        f.style.top = Math.random() * 95 + 'vh';
        f.style.left = Math.random() * 92 + 'vw';
        f.style.fontSize = (1.3 + Math.random() * 2) + 'rem';
        f.style.animationDuration = (5 + Math.random() * 6) + 's';
        f.style.animationDelay = (-Math.random() * 6) + 's';
        sky.appendChild(f);
      }
    })();
  </script>
</body>
</html>
