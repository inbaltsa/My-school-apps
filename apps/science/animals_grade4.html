        { q: 'עכביש 🕷️', o: ['חסר חוליות, אבל לא חרק', 'חרק', 'רכיכה', 'זוחל'], e: 'לעכביש יש 8 רגליים, ולכן הוא לא חרק.' },
        { q: 'סוסון ים', o: ['דג', 'יונק', 'רכיכה', 'זוחל'], e: 'סוסון הים נראה מוזר, אבל הוא נושם בזימים ויש לו סנפירים.' },
        { q: 'צדפה 🐚', o: ['רכיכה', 'דג', 'חרק', 'דו-חי'], e: 'לצדפה יש גוף רך וקונכייה משני חלקים.' },
        { q: 'קיפוד 🦔', o: ['יונק', 'זוחל', 'חרק', 'עוף'], e: 'הקוצים של הקיפוד הם שערות שהתקשו. הוא מניק את הגורים.' }
    ]
}
];

// ============================================================
// State
// ============================================================
const EXAM_APP_ID = 'animals_grade4';
const BEST_KEY = 'g4animals_best';
let quiz = [];
let qIndex = 0;
let score = 0;
let mode = 'topic';  // 'topic' | 'exam' | 'retry'
let currentTopic = null;
let wrongList = [];
let perTopic = {};

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function loadBest() {
    try { return JSON.parse(localStorage.getItem(BEST_KEY) || '{}'); } catch (e) { return {}; }
}
function saveBest(key, pct) {
    try {
        const b = loadBest();
        if (b[key] === undefined || pct > b[key]) { b[key] = pct; localStorage.setItem(BEST_KEY, JSON.stringify(b)); }
    } catch (e) {}
}

function show(id) {
    ['menu-screen', 'summary-screen', 'quiz-screen', 'result-screen'].forEach(s =>
        document.getElementById(s).classList.toggle('hidden', s !== id));
    window.scrollTo(0, 0);
}

// ============================================================
// Menu
// ============================================================
function topicCard(t, i, best) {
    return `
        <div class="topic-card" style="--c:${t.color}" onclick="showSummary(${i})">
            <span class="t-icon">${t.icon}</span>
            <span class="t-title">${t.title}</span>
            <span class="t-meta">${t.qs.length} שאלות · סיכום</span>
            ${best[t.id] !== undefined ? `<span class="t-best">הכי טוב: ${best[t.id]}% ${best[t.id] >= 90 ? '⭐' : ''}</span>` : ''}
        </div>`;
}

function showMenu() {
    const best = loadBest();
    document.getElementById('topics-wrap').innerHTML = PARTS.map((p, pi) => `
        <div class="part-title">${p.title} <small>(${p.pages})</small></div>
        <div class="topics-grid">
            ${TOPICS.map((t, i) => t.part === pi ? topicCard(t, i, best) : '').join('')}
        </div>`).join('');
    show('menu-screen');
}

function showSummary(i) {
    const t = TOPICS[i];
    currentTopic = i;
    const panel = document.getElementById('summary-panel');
    panel.style.setProperty('--c', t.color);
    panel.innerHTML = `
        <h2>${t.icon} ${t.title}</h2>
        <div class="pages">📖 ${t.pages}</div>
        <ul class="summary-list">${t.summary.map(s => `<li>${s}</li>`).join('')}</ul>
        <div class="actions">
            <button class="btn btn-light" onclick="showMenu()">🏠 לתפריט</button>
            <button class="btn btn-green" onclick="startTopic(${i})">✏️ לתרגול (${t.qs.length} שאלות)</button>
        </div>`;
    show('summary-screen');
}

// ============================================================
// Quiz
// ============================================================
function buildItem(topic, item) {
    return { topicId: topic.id, topicTitle: topic.title, q: item.q, o: shuffle(item.o), correct: item.o[0], e: item.e };
}

function startTopic(i) {
    mode = 'topic';
    currentTopic = i;
    const t = TOPICS[i];
    beginQuiz(shuffle(t.qs).map(it => buildItem(t, it)));
}

function startExam() {
    mode = 'exam';
    const items = [];
    TOPICS.forEach(t => shuffle(t.qs).slice(0, 3).forEach(it => items.push(buildItem(t, it))));
    beginQuiz(shuffle(items));
}

function startRetry() {
    mode = 'retry';
    beginQuiz(shuffle(wrongList).map(it => ({ ...it, o: shuffle(it.o) })));
}

function beginQuiz(items) {
    quiz = items;
    qIndex = 0;
    score = 0;
    wrongList = [];
    perTopic = {};
    show('quiz-screen');
    renderQuestion();
}

function renderQuestion() {
    const item = quiz[qIndex];
    document.getElementById('q-counter').textContent = `שאלה ${qIndex + 1} מתוך ${quiz.length}`;
    document.getElementById('q-topic').textContent = item.topicTitle;
    document.getElementById('q-score').textContent = `✅ ${score}`;
    document.getElementById('progress-bar').style.width = (qIndex / quiz.length * 100) + '%';
    document.getElementById('q-text').textContent =
        item.topicId === 'sort' ? `לאיזו קבוצה שייך: ${item.q}?` : item.q;
    const fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.innerHTML = '';
    document.getElementById('next-btn').classList.add('hidden');

    const opts = document.getElementById('options');
    opts.innerHTML = '';
    item.o.forEach(text => {
        const b = document.createElement('button');
        b.className = 'option';
        b.textContent = text;
        b.onclick = () => answer(b, text);
        opts.appendChild(b);
    });
}

function answer(btn, text) {
    const item = quiz[qIndex];
    const ok = text === item.correct;
    document.querySelectorAll('.option').forEach(b => {
        b.disabled = true;
        if (b.textContent === item.correct) b.classList.add('correct');
    });
    if (!perTopic[item.topicId]) perTopic[item.topicId] = { title: item.topicTitle, ok: 0, total: 0 };
    perTopic[item.topicId].total++;
    const fb = document.getElementById('feedback');
    if (ok) {
        score++;
        perTopic[item.topicId].ok++;
        fb.className = 'feedback show good';
        fb.innerHTML = `<b>✅ נכון!</b> ${item.e}`;
    } else {
        btn.classList.add('wrong');
        wrongList.push(item);
        fb.className = 'feedback show bad';
        fb.innerHTML = `<b>❌ לא בדיוק.</b> התשובה הנכונה: <b>${item.correct}</b><br>${item.e}`;
    }
    document.getElementById('q-score').textContent = `✅ ${score}`;
    const next = document.getElementById('next-btn');
    next.textContent = qIndex + 1 < quiz.length ? 'לשאלה הבאה ←' : 'לסיכום התוצאות 🏁';
    next.classList.remove('hidden');
}

function nextQuestion() {
    qIndex++;
    if (qIndex < quiz.length) renderQuestion();
    else showResult();
}

function showResult() {
    const total = quiz.length;
    const pct = Math.round(score / total * 100);
    let emoji = '💪', msg = 'כדאי לחזור על הסיכום ולנסות שוב!';
    if (pct >= 90) { emoji = '🏆'; msg = 'מצוין! את מוכנה למבחן!'; }
    else if (pct >= 75) { emoji = '🌟'; msg = 'כל הכבוד! עוד קצת חזרה על הטעויות ויהיה מושלם.'; }
    else if (pct >= 55) { emoji = '👍'; msg = 'בכיוון הנכון! כדאי לחזור על הנושאים החלשים.'; }

    if (mode === 'topic') saveBest(TOPICS[currentTopic].id, pct);
    if (mode === 'exam') {
        saveBest('exam', pct);
        if (typeof saveAppScore === 'function') saveAppScore(EXAM_APP_ID, score, total);
    }

    let breakdown = '';
    if (mode === 'exam') {
        const rows = Object.values(perTopic).sort((a, b) => (a.ok / a.total) - (b.ok / b.total));
        breakdown = `<h3 style="margin-top:18px;">לפי נושא:</h3><div class="breakdown">` +
            rows.map(r => `<div class="breakdown-row ${r.ok < r.total ? 'weak' : ''}"><span>${r.title}</span><span>${r.ok}/${r.total} ${r.ok === r.total ? '✅' : '🔁'}</span></div>`).join('') +
            `</div>`;
    }

    const retryBtn = wrongList.length
        ? `<button class="btn btn-orange" onclick="startRetry()">🔁 לתרגל שוב את הטעויות (${wrongList.length})</button>` : '';
    const againBtn = mode === 'exam'
        ? `<button class="btn btn-primary" onclick="startExam()">📝 מבחן מסכם חדש</button>`
        : (mode === 'topic' ? `<button class="btn btn-primary" onclick="startTopic(${currentTopic})">🔄 שוב את הנושא</button>` : '');

    document.getElementById('result-panel').innerHTML = `
        <div class="result-big">${emoji}</div>
        <div class="result-score">${score} מתוך ${total} (${pct}%)</div>
        <div class="result-msg">${msg}</div>
        ${breakdown}
        <div class="actions">
            ${retryBtn}
            ${againBtn}
            <button class="btn btn-light" onclick="showMenu()">🏠 לתפריט</button>
        </div>`;
    show('result-screen');
}

showMenu();
</script>
<script src="../../app-tracker.js"></script>
</body>
</html>
