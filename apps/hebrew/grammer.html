<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בלש האותיות - עם תמונות</title>
    <style>
        :root {
            --primary: #FF9F43;
            --secondary: #54a0ff;
            --wrong: #ff6b6b;
            --correct: #1dd1a1;
            --bg: #feca57; /* רקע צהוב שמח יותר */
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #fff;
            font-size: 2.2em;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .game-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #f1f2f6;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* עיצוב התמונה (אימוג'י) */
        .emoji-display {
            font-size: 100px;
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .word-display {
            font-size: 3em;
            margin-bottom: 30px;
            color: #2d3436;
            font-weight: bold;
        }

        .missing-letter {
            color: var(--primary);
            border-bottom: 4px solid var(--primary);
            padding: 0 5px;
            display: inline-block;
            min-width: 40px;
        }

        .options-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .option-btn {
            background: white;
            border: 3px solid #ced6e0;
            color: #2d3436;
            font-size: 2.2em;
            padding: 10px 35px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 0px #ced6e0;
        }

        .option-btn:hover {
            transform: translateY(-2px);
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .feedback {
            margin-top: 20px;
            height: 30px;
            font-size: 1.4em;
            font-weight: bold;
        }

        .score-display {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #636e72;
            background: #f1f2f6;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .category-badge {
            background: #ff9f43;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.9em;
        }

        /* אנימציות שגיאה/הצלחה */
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .pulse { animation: pulse 0.4s; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* מסך סיום */
        #end-screen { display: none; }
        
        button.restart-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.5em;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(84, 160, 255, 0.4);
        }
    </style>
</head>
<body>

    <h1>בלש האותיות 🖼️</h1>

    <div class="game-container" id="game-container">
        <div id="game-screen">
            <div class="score-display">ניקוד: <span id="score">0</span></div>
            <div class="category-badge" id="category-label">קטגוריה</div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>

            <div class="emoji-display" id="emoji-display">❓</div>

            <div class="word-display" id="word-display">
                </div>

            <div class="options-container" id="buttons-container">
                </div>

            <div class="feedback" id="feedback-text"></div>
        </div>

        <div id="end-screen">
            <div style="font-size: 80px;">🏆</div>
            <h2 style="font-size: 2.5em; color: var(--secondary);">כל הכבוד!</h2>
            <p style="font-size: 1.3em;">סיימת את כל המילים!</p>
            <p>הציון הסופי שלך: <span id="final-score" style="color: var(--primary); font-weight: bold; font-size: 1.5em;"></span></p>
            <button class="restart-btn" onclick="startGame()">שחקי שוב</button>
        </div>
    </div>

    <script>
        // מאגר 30 מילים (שמות עצם) עם אימוג'יז
        const wordsData = [
            // --- א' או ע' ---
            { emoji: "🍉", full: "אֲבַטִּיחַ", word: "__בַטִּיחַ", correct: "אֲ", wrong: "עֲ", type: "א/ע" },
            { emoji: "🎂", full: "עוּגָה", word: "__וּגָה", correct: "ע", wrong: "א", type: "א/ע" },
            { emoji: "🐰", full: "אַרְנָב", word: "__רְנָב", correct: "אַ", wrong: "עַ", type: "א/ע" },
            { emoji: "⌚", full: "שָׁעוֹן", word: "שָׁ__וֹן", correct: "ע", wrong: "א", type: "א/ע" },
            { emoji: "✏️", full: "עִיפָּרוֹן", word: "__ִיפָּרוֹן", correct: "ע", wrong: "א", type: "א/ע" },
            { emoji: "🚌", full: "אוֹטוֹבּוּס", word: "__וֹטוֹבּוּס", correct: "א", wrong: "ע", type: "א/ע" },
            { emoji: "🦁", full: "אַרְיֵה", word: "__רְיֵה", correct: "אַ", wrong: "עַ", type: "א/ע" },
            { emoji: "🌳", full: "עֵץ", word: "__ֵץ", correct: "ע", wrong: "א", type: "א/ע" },
            { emoji: "🎧", full: "אוֹזְנִיּוֹת", word: "__וֹזְנִיּוֹת", correct: "א", wrong: "ע", type: "א/ע" },
            { emoji: "🕷️", full: "עַכָּבִישׁ", word: "__ַכָּבִישׁ", correct: "עַ", wrong: "אַ", type: "א/ע" },

            // --- ט' או ת' ---
            { emoji: "🦜", full: "תּוּכִּי", word: "__וּכִּי", correct: "תּ", wrong: "טּ", type: "ט/ת" },
            { emoji: "☔", full: "מִטְרִיָּה", word: "מִ__רִיָּה", correct: "טְ", wrong: "תְ", type: "ט/ת" },
            { emoji: "🍓", full: "תּוּת", word: "__וּת", correct: "תּ", wrong: "טּ", type: "ט/ת" },
            { emoji: "📺", full: "טֶלֶוִיזְיָה", word: "__ֶלֶוִיזְיָה", correct: "ט", wrong: "ת", type: "ט/ת" },
            { emoji: "🍎", full: "תַּפּוּחַ", word: "__ַפּוּחַ", correct: "תּ", wrong: "טּ", type: "ט/ת" },
            { emoji: "✈️", full: "מָטוֹס", word: "מָ__וֹס", correct: "ט", wrong: "ת", type: "ט/ת" },
            { emoji: "🔑", full: "מַפְתֵּחַ", word: "מַפְ__ֵחַ", correct: "תּ", wrong: "טּ", type: "ט/ת" },
            { emoji: "🐊", full: "תַּנִּין", word: "__ַנִּין", correct: "תּ", wrong: "טּ", type: "ט/ת" },
            { emoji: "👶", full: "תִּינוֹק", word: "__ִינוֹק", correct: "תּ", wrong: "טּ", type: "ט/ת" },
            { emoji: "💍", full: "טַבַּעַת", word: "__ַבַּעַת", correct: "ט", wrong: "ת", type: "ט/ת" },

            // --- כ' או ק' ---
            { emoji: "⚽", full: "כַּדּוּר", word: "__ַדּוּר", correct: "כּ", wrong: "ק", type: "כ/ק" },
            { emoji: "🧢", full: "כּוֹבַע", word: "__וֹבַע", correct: "כּ", wrong: "ק", type: "כ/ק" },
            { emoji: "🐒", full: "קוֹף", word: "__וֹף", correct: "ק", wrong: "כּ", type: "כ/ק" },
            { emoji: "🚂", full: "רַכֶּבֶת", word: "רַ__ֶבֶת", correct: "כּ", wrong: "ק", type: "כ/ק" },
            { emoji: "🐶", full: "כֶּלֶב", word: "__ֶלֶב", correct: "כּ", wrong: "ק", type: "כ/ק" },
            { emoji: "🌈", full: "קֶשֶׁת", word: "__ֶשֶׁת", correct: "ק", wrong: "כּ", type: "כ/ק" },
            { emoji: "⭐", full: "כּוֹכָב", word: "__וֹכָב", correct: "כּ", wrong: "ק", type: "כ/ק" },
            { emoji: "🌵", full: "קַקְטוּס", word: "__ַקְטוּס", correct: "ק", wrong: "כּ", type: "כ/ק" },
            { emoji: "🥄", full: "כַּף", word: "__ַף", correct: "כּ", wrong: "ק", type: "כ/ק" },
            { emoji: "⛑️", full: "קַסְדָּה", word: "__ַסְדָּה", correct: "ק", wrong: "כּ", type: "כ/ק" }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledWords = [];

        function startGame() {
            score = 0;
            currentQuestionIndex = 0;
            shuffledWords = [...wordsData].sort(() => Math.random() - 0.5);
            
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateScore();
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= shuffledWords.length) {
                endGame();
                return;
            }

            const q = shuffledWords[currentQuestionIndex];
            
            // עדכון טקסטים
            document.getElementById('category-label').textContent = "זוגות: " + q.type;
            document.getElementById('feedback-text').textContent = '';
            document.getElementById('emoji-display').textContent = q.emoji;
            
            // עדכון פס התקדמות
            const progress = (currentQuestionIndex / shuffledWords.length) * 100;
            document.getElementById('progress').style.width = `${progress}%`;

            // הצגת המילה עם קו תחתון
            const wordDisplay = document.getElementById('word-display');
            wordDisplay.innerHTML = q.word.replace('__', '<span class="missing-letter">?</span>');

            // יצירת הכפתורים
            const container = document.getElementById('buttons-container');
            container.innerHTML = '';

            const options = [
                { text: q.correct, isCorrect: true },
                { text: q.wrong, isCorrect: false }
            ].sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                btn.onclick = () => handleAnswer(btn, opt.isCorrect, q);
                container.appendChild(btn);
            });
        }

        function handleAnswer(btn, isCorrect, questionData) {
            const container = document.getElementById('buttons-container');
            
            // נעל כפתורים זמנית
            Array.from(container.children).forEach(b => b.disabled = true);

            if (isCorrect) {
                // תשובה נכונה
                btn.style.backgroundColor = 'var(--correct)';
                btn.style.borderColor = 'var(--correct)';
                btn.style.color = 'white';
                btn.style.boxShadow = 'none';
                
                document.getElementById('word-display').innerHTML = questionData.full;
                document.getElementById('word-display').classList.add('pulse');
                
                document.getElementById('feedback-text').textContent = 'מעולה! 😄';
                document.getElementById('feedback-text').style.color = 'var(--correct)';
                score += 10;
                
                setTimeout(() => {
                    document.getElementById('word-display').classList.remove('pulse');
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1000);

            } else {
                // תשובה שגויה
                btn.style.backgroundColor = 'var(--wrong)';
                btn.style.borderColor = 'var(--wrong)';
                btn.style.color = 'white';
                
                const gameContainer = document.getElementById('game-container');
                gameContainer.classList.add('shake');
                
                document.getElementById('feedback-text').textContent = 'לא נורא, נסי שוב...';
                document.getElementById('feedback-text').style.color = 'var(--wrong)';
                
                setTimeout(() => {
                    gameContainer.classList.remove('shake');
                    // שחרור הכפתור השני ללחיצה
                    Array.from(container.children).forEach(b => {
                        if (b !== btn) b.disabled = false;
                    });
                }, 800);
            }
            updateScore();
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            document.getElementById('final-score').textContent = score;
        }

        // התחלה
        startGame();

    </script>
<script src="../../back-link.js" data-back="grade-3.html"></script>
</body>
</html>
